name: AI Transfer Agent

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 08:00 UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    # Grants the GitHub Actions bot permission to write back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent Analysis
        env:
          GROQ_API_KEY3: ${{ secrets.GROQ_API_KEY3 }}
        run: python run_agent.py

      - name: Commit and Push Updated Matrix Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TRANSFER_REPORT.md
          git commit -m "chore: update daily premier league transfer intelligence matrix [skip ci]" || echo "No changes to commit"
          git push
